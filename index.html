<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Fenceline</title>
<meta name="description" content="Arizona hunting maps: land ownership, game units, property lines, water, wind, offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fenceline">
<meta name="theme-color" content="#10140e">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div id="map" role="application" aria-label="Hunting map"></div>

  <header class="topbar" id="topbar">
    <button class="chip chip-search" id="chip-search" type="button" aria-label="Search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Search place, unit, owner</span>
    </button>
    <button class="chip" id="chip-unit" type="button" aria-label="Game management unit">Unit —</button>
    <button class="chip" id="chip-weather" type="button" aria-label="Wind and weather">Wind —</button>
  </header>

  <div class="rail" id="rail">
    <button class="rail-btn" id="btn-locate" type="button" aria-label="My location">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
    </button>
    <button class="rail-btn" id="btn-3d" type="button" aria-label="3D terrain"><span class="rail-text">3D</span></button>
    <button class="rail-btn" id="btn-basemap" type="button" aria-label="Basemap">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3z"/><path d="M9 4v13M15 7v13"/></svg>
    </button>
    <button class="rail-btn" id="btn-compass" type="button" aria-label="Reset north">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 5l3 7-3 7-3-7z" fill="currentColor"/></svg>
    </button>
    <div class="rail-group">
      <button class="rail-btn" id="btn-zoom-in" type="button" aria-label="Zoom in"><span class="rail-text">+</span></button>
      <button class="rail-btn" id="btn-zoom-out" type="button" aria-label="Zoom out"><span class="rail-text">−</span></button>
    </div>
  </div>

  <div class="status-left" id="status-left"></div>

  <div class="banner" id="banner" hidden role="status" aria-live="assertive"></div>
  <div class="toolbar" id="toolbar" hidden></div>
  <div class="card" id="card" hidden></div>
  <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-handle" id="sheet-handle"><span></span></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <button class="tab" data-tab="map" type="button" aria-selected="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3z"/></svg><span>Map</span>
    </button>
    <button class="tab" data-tab="layers" type="button" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5M3 16l9 5 9-5"/></svg><span>Layers</span>
    </button>
    <button class="tab" data-tab="hunt" type="button" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14c3-6 13-6 16 0"/><path d="M12 4v4M5 7l2 2M19 7l-2 2M3 19h18"/></svg><span>Hunt</span>
    </button>
    <button class="tab" data-tab="markup" type="button" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg><span>Markup</span>
    </button>
    <button class="tab" data-tab="more" type="button" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg><span>More</span>
    </button>
  </nav>

  <div class="modal" id="modal" hidden></div>
</div>
<script src="vendor/maplibre-gl.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
