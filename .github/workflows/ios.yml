# Builds the Fenceline iOS app as an unsigned IPA on every push to main (workflow artifact) and on v* tags (release asset).
# No Apple account is involved: the IPA is signed on the PC by Sideloadly or AltStore at install time (docs/install-ios.md).
name: iOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Capacitor and plugins
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Copy the web app into dist/ and sync the Xcode project
        run: |
          npm run build:web
          npx cap sync ios

      - name: Tool versions
        run: |
          xcodebuild -version
          sw_vers

      - name: Pick the version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "marketing=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "marketing=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Archive without signing
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Fenceline.xcarchive \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.ver.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee build/xcodebuild.log | grep -E --line-buffered 'error:|warning: .*App/|\*\* ARCHIVE' || true
          test -d build/Fenceline.xcarchive/Products/Applications

      - name: Package Payload into Fenceline.ipa
        run: |
          set -euo pipefail
          APP="$(find build/Fenceline.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$APP"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../Fenceline.ipa Payload)
          ls -la build/Fenceline.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' -c 'Print :UIBackgroundModes' "$APP/Info.plist"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Fenceline-ipa
          path: build/Fenceline.ipa
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Fenceline.ipa
          generate_release_notes: true
          body: |
            Unsigned iOS build. Install it from a Windows PC with Sideloadly or AltStore using a free Apple ID; see `docs/install-ios.md`.
